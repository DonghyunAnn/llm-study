<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FineWeb 처리 단계 깔때기</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--color-paper:#f6f5f2;--color-ink:#1f2023;--color-muted:#55595f;--color-accent:#b3402a;--font-sans:'Geist','Noto Sans KR',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif KR',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}.frame{max-width:1200px;width:100%}.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;color:var(--color-ink);margin-bottom:1.5rem}svg{width:100%;min-width:900px;display:block}</style></head>
<body><div class="frame"><p class="eyebrow">Funnel · FineWeb</p><h1>웹 36조 토큰이 1.3조가 되기까지</h1>
    <svg viewBox="0 0 1000 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recipe-funnel-title recipe-funnel-desc">
      <title id="recipe-funnel-title">FineWeb 처리 단계와 남는 토큰 수</title>
      <desc id="recipe-funnel-desc">기본 필터 후 36조 토큰이 크롤별 MinHash로 20조, C4와 자체 필터로 15조, 교육 분류기로 1.3조 토큰이 되는 깔때기.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55595f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3402a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5a6e"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f6f5f2"/>
      <text x="40" y="56" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DROP-OFF ↓ · 각 층의 아래 폭 = 그 단계 뒤 남는 토큰 수 (GPT-2 tokenizer)</text>
      <polygon points="120.0,72 680.0,72 680.0,136 120.0,136" fill="#ebeae6" stroke="#55595f" stroke-width="1"/>
      <text x="400" y="102.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">기본 필터</text>
      <text x="400" y="117.0" fill="#55595f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">→ 36T</text>
      <text x="704.0" y="108.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">URL 차단 · 영어 ≥ 0.65 · MassiveText</text>
      <polygon points="120.0,136 680.0,136 555.6,200 244.4,200" fill="#ebeae6" stroke="#55595f" stroke-width="1"/>
      <text x="400" y="166.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">크롤별 독립 MinHash</text>
      <text x="400" y="181.0" fill="#55595f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">→ 20T</text>
      <text x="704.0" y="172.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">−44% · 통합 dedup(4T)은 dedup 안 한 것과 차이 없음</text>
      <polygon points="244.4,200 555.6,200 516.7,264 283.3,264" fill="#ebeae6" stroke="#55595f" stroke-width="1"/>
      <text x="400" y="230.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">C4 필터 + 자체 필터 3개</text>
      <text x="400" y="245.0" fill="#55595f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">→ 15T</text>
      <text x="704.0" y="236.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">−25% · 자체 필터 3개는 2019-18 실험에서 약 22%</text>
      <polygon points="283.3,264 516.7,264 410.1,328 389.9,328" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/>
      <text x="704.0" y="294.0" fill="#b3402a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif">Edu 분류기 ≥ 3점 → 1.3T</text>
      <text x="704.0" y="309.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">−92% · 2점 기준은 5.4T</text>
      <line x1="40" y1="360" x2="960" y2="360" stroke="rgba(31,32,35,0.10)" stroke-width="0.8"/>
      <text x="40" y="376" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="386" width="14" height="10" rx="2" fill="#ebeae6" stroke="#55595f" stroke-width="1"/><text x="60" y="394" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">FineWeb 단계 (결과 토큰 수)</text>
      <rect x="260" y="386" width="14" height="10" rx="2" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/><text x="280" y="394" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">FineWeb-Edu · 최종 1.3T</text>
      <text x="960" y="394" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif" font-style="italic" text-anchor="end">입력: Common Crawl 96개 크롤(WARC → trafilatura). 기본 필터 전, 추출 직후, C4 직후의 토큰 수는 보고서에 없음</text>
    </svg></div></body></html>
