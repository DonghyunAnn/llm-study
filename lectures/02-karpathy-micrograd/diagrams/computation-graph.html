<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>micrograd 계산 그래프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f5f2;
      --color-ink:     #1f2023;
      --color-muted:   #55595f;
      --color-accent:  #b3402a;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · micrograd</p>
    <h1>계산 그래프: L = (a·b + c)·f</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="computation-graph-title computation-graph-desc">
      <title id="computation-graph-title">micrograd 계산 그래프 L = (a·b + c)·f</title>
      <desc id="computation-graph-desc">출력 L에서 입력 a, b, c, f로 내려가는 계산 그래프. 각 노드에 forward 값(data)과 backward로 구한 기울기(grad)를 함께 적었다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55595f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3402a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5a6e"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f5f2"/>

      <!-- Tier tags -->
      <text x="40" y="92" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OUTPUT</text>
      <text x="40" y="212" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STEP 2</text>
      <text x="40" y="332" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STEP 1</text>
      <text x="40" y="452" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INPUT</text>

      <!-- Connectors (drawn before nodes). Parent drops, sibling bus, child drops. -->
      <!-- L -> d, f -->
      <path d="M 500 112 L 500 152 L 340 152 L 340 184" fill="none" stroke="#55595f" stroke-width="1"/>
      <path d="M 500 152 L 660 152 L 660 184" fill="none" stroke="#55595f" stroke-width="1"/>
      <!-- d -> e, c -->
      <path d="M 340 232 L 340 272 L 180 272 L 180 304" fill="none" stroke="#55595f" stroke-width="1"/>
      <path d="M 340 272 L 500 272 L 500 304" fill="none" stroke="#55595f" stroke-width="1"/>
      <!-- e -> a, b -->
      <path d="M 180 352 L 180 392 L 100 392 L 100 424" fill="none" stroke="#55595f" stroke-width="1"/>
      <path d="M 180 392 L 280 392 L 280 424" fill="none" stroke="#55595f" stroke-width="1"/>

      <!-- Root: L (focal) -->
      <rect x="420" y="64" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="64" width="160" height="48" rx="6" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/>
      <rect x="428" y="72" width="20" height="12" rx="2" fill="transparent" stroke="rgba(179,64,42,0.50)" stroke-width="0.8"/>
      <text x="438" y="81" fill="#b3402a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">*</text>
      <text x="500" y="88" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">L = d · f</text>
      <text x="500" y="102" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data -8.0 · grad 1.0</text>

      <!-- Tier 1: d -->
      <rect x="260" y="184" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="260" y="184" width="160" height="48" rx="6" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <rect x="268" y="192" width="20" height="12" rx="2" fill="transparent" stroke="rgba(31,32,35,0.40)" stroke-width="0.8"/>
      <text x="278" y="201" fill="#1f2023" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+</text>
      <text x="340" y="208" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">d = e + c</text>
      <text x="340" y="222" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data 4.0 · grad -2.0</text>

      <!-- Tier 1: f (leaf) -->
      <rect x="580" y="184" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="580" y="184" width="160" height="48" rx="6" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="660" y="208" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">f</text>
      <text x="660" y="222" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data -2.0 · grad 4.0</text>

      <!-- Tier 2: e -->
      <rect x="100" y="304" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="100" y="304" width="160" height="48" rx="6" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <rect x="108" y="312" width="20" height="12" rx="2" fill="transparent" stroke="rgba(31,32,35,0.40)" stroke-width="0.8"/>
      <text x="118" y="321" fill="#1f2023" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">*</text>
      <text x="180" y="328" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">e = a · b</text>
      <text x="180" y="342" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data -6.0 · grad -2.0</text>

      <!-- Tier 2: c (leaf) -->
      <rect x="420" y="304" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="304" width="160" height="48" rx="6" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="500" y="328" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">c</text>
      <text x="500" y="342" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data 10.0 · grad -2.0</text>

      <!-- Tier 3: a (leaf) -->
      <rect x="20" y="424" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="20" y="424" width="160" height="48" rx="6" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="100" y="448" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a</text>
      <text x="100" y="462" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data 2.0 · grad 6.0</text>

      <!-- Tier 3: b (leaf) -->
      <rect x="200" y="424" width="160" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="200" y="424" width="160" height="48" rx="6" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="280" y="448" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">b</text>
      <text x="280" y="462" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data -3.0 · grad -4.0</text>

      <!-- Legend strip -->
      <line x1="40" y1="496" x2="960" y2="496" stroke="rgba(31,32,35,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="522" width="14" height="10" rx="2" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/>
      <text x="60" y="530" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">출력 · 역전파 출발점 (grad = 1)</text>

      <rect x="260" y="522" width="14" height="10" rx="2" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <text x="280" y="530" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">연산으로 만들어진 노드 (자기 미분 규칙 보유)</text>

      <rect x="460" y="522" width="14" height="10" rx="2" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="480" y="530" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">입력 (잎)</text>

      <text x="600" y="530" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif" font-style="italic">data는 위로(forward), grad는 아래로(backward) 흐른다.</text>
    </svg>
  </div>
</body>
</html>
