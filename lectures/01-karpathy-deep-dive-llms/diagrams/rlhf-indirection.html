<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLHF: 사람 대신 사람의 시뮬레이터를 채점자로</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f6f5f2; --color-ink: #1f2023; --color-muted: #55595f; --color-accent: #b3402a;
      --font-sans: 'Geist', 'Noto Sans KR', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif KR', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Deep Dive into LLMs</p>
    <h1>RLHF: 사람 대신 사람의 시뮬레이터를 채점자로</h1>
    <svg viewBox="0 0 1000 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rlhf-indirection-title rlhf-indirection-desc">
      <title id="rlhf-indirection-title">RLHF: 사람 대신 사람의 시뮬레이터를 채점자로</title>
      <desc id="rlhf-indirection-desc">1,000개 프롬프트의 5개 롤아웃을 사람이 순서 매기고, 그 순서에 맞는 reward model을 학습한 뒤, 그 모델을 상대로 RL을 돌려 RL 모델을 얻는 흐름.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55595f"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3402a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5a6e"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d8188"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f6f5f2"/>
      <line x1="560.0" y1="96" x2="560.0" y2="134" stroke="#55595f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560.0" y1="184" x2="560.0" y2="222" stroke="#55595f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560.0" y1="272" x2="560.0" y2="310" stroke="#55595f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560.0" y1="360" x2="560.0" y2="398" stroke="#55595f" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="48" width="280" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="48" width="280" height="48" rx="6" fill="rgba(85,89,95,0.10)" stroke="#7d8188" stroke-width="0.8"/>
      <text x="560.0" y="70.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">1,000 프롬프트 × 5 롤아웃</text>
      <text x="560.0" y="84.0" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">"write a joke about pelicans"</text>
      <rect x="420" y="136" width="280" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="136" width="280" height="48" rx="6" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <rect x="428" y="142" width="38" height="12" rx="2" fill="transparent" stroke="#1f2023" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="447.0" y="151" fill="#1f2023" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
      <text x="560.0" y="167.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">사람이 순서를 매긴다</text>
      <text x="560.0" y="181.0" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">best → worst · 5,000회 판단</text>
      <rect x="420" y="224" width="280" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="224" width="280" height="48" rx="6" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/>
      <rect x="428" y="230" width="38" height="12" rx="2" fill="transparent" stroke="#b3402a" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="447.0" y="239" fill="#b3402a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
      <text x="560.0" y="255.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Reward model 학습</text>
      <text x="560.0" y="269.0" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(프롬프트, 응답) → 점수 · 순서와 일치하도록</text>
      <rect x="420" y="312" width="280" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="312" width="280" height="48" rx="6" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <rect x="428" y="318" width="38" height="12" rx="2" fill="transparent" stroke="#1f2023" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="447.0" y="327" fill="#1f2023" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
      <text x="560.0" y="343.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Reward model을 상대로 RL</text>
      <text x="560.0" y="357.0" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10억 회 채점을 시뮬레이터가 대신</text>
      <rect x="420" y="400" width="280" height="48" rx="6" fill="#f6f5f2"/>
      <rect x="420" y="400" width="280" height="48" rx="6" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="560.0" y="422.0" fill="#1f2023" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">RL model</text>
      <text x="560.0" y="436.0" fill="#55595f" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">수백 스텝 뒤에는 reward hacking</text>
      <text x="724" y="75.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">사람이 직접 채점하면 1,000 × 1,000 × 1,000 = 10억 회</text>
      <text x="724" y="163.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">점수보다 순서가 사람에게 쉽다</text>
      <text x="724" y="251.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">Transformer지만 언어를 생성하지 않는 채점 전용 모델</text>
      <text x="724" y="339.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">시뮬레이터라 무한히 물어볼 수 있다</text>
      <text x="724" y="427.0" fill="#7d8188" font-size="9" font-family="'Geist Mono', monospace">"the the the the"가 점수 1.0을 받는 순간 멈춘다</text>
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(31,32,35,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#55595f" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="506" width="14" height="10" rx="2" fill="rgba(85,89,95,0.10)" stroke="#7d8188" stroke-width="0.8"/>
      <text x="60" y="514" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">입력</text>
      <rect x="109.0" y="506" width="14" height="10" rx="2" fill="#ffffff" stroke="#1f2023" stroke-width="1"/>
      <text x="129.0" y="514" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">단계</text>
      <rect x="178.0" y="506" width="14" height="10" rx="2" fill="rgba(179,64,42,0.08)" stroke="#b3402a" stroke-width="1"/>
      <text x="198.0" y="514" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">간접화의 핵심</text>
      <rect x="286.1" y="506" width="14" height="10" rx="2" fill="rgba(31,32,35,0.05)" stroke="#55595f" stroke-width="0.8"/>
      <text x="306.1" y="514" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">결과물</text>
      <text x="960" y="514" fill="#55595f" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif" font-style="italic" text-anchor="end">사람의 판단을 신경망으로 복제한 뒤 그 복제본을 상대로 최적화한다</text>

    </svg>
  </div>
</body>
</html>
